name: 台股消息面每日更新

on:
  schedule:
    # GitHub 的排程時間一律是 UTC，台灣時間要減 8 小時。
    # 另外 GitHub 排程常有 10 到 30 分鐘延遲，屬正常現象。
    - cron: '30 0 * * 1-5'   # 台北 08:30  開盤前
    - cron: '0 3 * * 1-5'    # 台北 11:00  盤中
    - cron: '45 6 * * 1-5'   # 台北 14:45  收盤後，順便更新市值名單
    - cron: '30 9 * * 1-5'   # 台北 17:30  盤後補抓
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '強制重建市值名單與別名表'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: 取出儲存庫
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝套件
        run: pip install requests certifi

      - name: 更新市值名單與別名表
        # 收盤價 14:30 後才完整，所以排程只在下午那班更新。
        # 另外兩種情況也會重建：檔案還不存在，或手動執行時勾了強制重建。
        run: |
          HOUR=$(date -u +%H)
          FORCE="${{ github.event.inputs.force_rebuild }}"
          if [ ! -f aliases.json ] || [ "$HOUR" = "06" ] || [ "$FORCE" = "true" ]; then
            echo "開始重建名單"
            python build_universe.py --top 150 --seed alias_seed.json
          else
            echo "略過名單更新（非收盤後時段，且未要求強制重建）"
          fi

      - name: 抓取重大訊息
        # 非交易日或單一來源異常不應讓整個流程中斷
        continue-on-error: true
        run: python mops_fetch.py

      - name: 產生摘要
        continue-on-error: true
        run: python report.py --days 3

      - name: 檢查產出
        run: |
          echo "=== 目前檔案 ==="
          ls -la *.csv *.json *.db *.md *.txt 2>/dev/null || echo "（尚無產出）"

      - name: 提交結果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 只加入實際存在的檔案，避免第一次執行時因檔案不存在而中斷
          for f in news.db digest.md universe.csv aliases.json collisions.txt; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "沒有新資料，不提交"
          else
            git commit -m "自動更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push
          fi

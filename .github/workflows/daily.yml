name: 台股消息面每日更新

on:
  schedule:
    # GitHub 的排程時間一律是 UTC，台灣時間要減 8 小時。
    # 另外 GitHub 排程常有 10 到 30 分鐘延遲，屬正常現象。
    - cron: '30 0 * * 1-5'   # 台北 08:30  開盤前
    - cron: '0 3 * * 1-5'    # 台北 11:00  盤中
    - cron: '45 6 * * 1-5'   # 台北 14:45  收盤後，順便更新市值名單
    - cron: '30 9 * * 1-5'   # 台北 17:30  盤後補抓
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '強制重建市值名單與別名表'
        type: boolean
        default: true
      force_rss:
        description: '忽略 RSS 的最小抓取間隔（連續手動執行時勾這個）'
        type: boolean
        default: false
      sim_merge:
        description: '事件合併門檻，留空用預設 0.45'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: 取出儲存庫
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝套件
        # feedparser 是這次新增的。RSS 的日期格式、編碼與破損 XML 各家寫法都不同，
        # 自己用 xml.etree 剖析會一直踩坑，而你無法在本機測試，所以用成熟套件。
        run: pip install requests certifi feedparser

      - name: 更新市值名單與別名表
        # 收盤價 14:30 後才完整，所以排程只在下午那班更新。
        # 另外兩種情況也會重建：檔案還不存在，或手動執行時勾了強制重建。
        run: |
          HOUR=$(date -u +%H)
          FORCE="${{ github.event.inputs.force_rebuild }}"
          if [ ! -f aliases.json ] || [ "$HOUR" = "06" ] || [ "$FORCE" = "true" ]; then
            echo "開始重建名單"
            python build_universe.py --top 150 --seed alias_seed.json
          else
            echo "略過名單更新（非收盤後時段，且未要求強制重建）"
          fi

      - name: 抓取重大訊息
        # 非交易日或單一來源異常不應讓整個流程中斷
        continue-on-error: true
        run: python mops_fetch.py

      - name: 抓取媒體 RSS
        # 放在 MOPS 之後執行是刻意的：公告先進資料庫，媒體報導後到時才會
        # 併進既有事件而不是自己開一則。反過來的話，同一件事會先以媒體標題
        # 建立事件，之後公告進來雖然會因為 tier 較高而覆寫標題，但多繞一圈。
        continue-on-error: true
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force_rss }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ -n "${{ github.event.inputs.sim_merge }}" ]; then
            ARGS="$ARGS --sim-merge ${{ github.event.inputs.sim_merge }}"
          fi
          echo "參數：$ARGS"
          python rss_fetch.py $ARGS

      - name: 產生摘要
        continue-on-error: true
        run: python report.py --days 3

      - name: 檢查產出
        run: |
          echo "=== 目前檔案 ==="
          ls -la *.csv *.json *.db *.md *.txt 2>/dev/null || echo "（尚無產出）"
          echo "=== 網站資料 ==="
          ls -la docs/ 2>/dev/null || echo "（docs/ 還不存在，請先上傳 docs/index.html）"

      - name: 提交結果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 只加入實際存在的檔案，避免第一次執行時因檔案不存在而中斷
          for f in news.db digest.md cluster_audit.md universe.csv aliases.json collisions.txt; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          # 網站資料。docs/ 就是 GitHub Pages 的發佈目錄，
          # 這一行提交完成的同時網站就會更新（Pages 部署約再等一分鐘）。
          if [ -f docs/data.json ]; then git add docs/data.json; fi
          if git diff --staged --quiet; then
            echo "沒有新資料，不提交"
          else
            git commit -m "自動更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push
          fi
